name: Build

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must start with v). Example: v1.2.3"
        required: false
        default: ""

jobs:
  build:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'v')) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            qt_host: linux
            qt_arch: gcc_64
            ortools_url: https://github.com/google/or-tools/releases/download/v9.11/or-tools_amd64_ubuntu-24.04_cpp_v9.11.4210.tar.gz
            ortools_dir: or-tools_x86_64_Ubuntu-24.04_cpp_v9.11.4210
          - os: macos-latest
            qt_host: mac
            qt_arch: clang_64
            ortools_url: https://github.com/google/or-tools/releases/download/v9.11/or-tools_arm64_macOS-14.6.1_cpp_v9.11.4210.tar.gz
            ortools_dir: or-tools_arm64_macOS-14.6.1_cpp_v9.11.4210
          - os: windows-latest
            qt_host: windows
            qt_arch: win64_msvc2019_64
            ortools_url: https://github.com/google/or-tools/releases/download/v9.11/or-tools_x64_VisualStudio2022_cpp_v9.11.4210.zip
            ortools_dir: or-tools_x64_VisualStudio2022_cpp_v9.11.4210

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.*"
          host: ${{ matrix.qt_host }}
          target: "desktop"
          arch: ${{ matrix.qt_arch }}
          modules: ""
          cache: true
          tools: "tools_cmake"

      - name: Debug Qt paths
        shell: bash
        run: |
          echo "Qt6_DIR: $Qt6_DIR"
          echo "QT_ROOT_DIR: $QT_ROOT_DIR"
          echo "IQTA_TOOLS: $IQTA_TOOLS"
          ls -la $QT_ROOT_DIR/../ || true
          find $QT_ROOT_DIR/.. -name "macdeployqt*" 2>/dev/null || true
          find $QT_ROOT_DIR/.. -name "windeployqt*" 2>/dev/null || true

      - name: Download OR-Tools (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          wget -q ${{ matrix.ortools_url }}
          tar -xzf or-tools_*.tar.gz
          echo "ORTOOLS_ROOT=${{ github.workspace }}/${{ matrix.ortools_dir }}" >> $GITHUB_ENV

      - name: Download OR-Tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "${{ matrix.ortools_url }}" -OutFile "or-tools.zip"
          Expand-Archive -Path "or-tools.zip" -DestinationPath "."
          echo "ORTOOLS_ROOT=${{ github.workspace }}\${{ matrix.ortools_dir }}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Python (for XLSX support)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure CMake (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${ORTOOLS_ROOT};${Qt6_DIR}"

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:ORTOOLS_ROOT;$env:Qt6_DIR"

      - name: Build
        run: cmake --build build --config Release -j

      - name: Create AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          # Install dependencies for AppImage creation
          sudo apt-get update
          sudo apt-get install -y libfuse2 imagemagick

          # Install linuxdeploy and Qt plugin
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

          # Create AppDir structure
          mkdir -p AppDir/usr/bin AppDir/usr/lib AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/src/ClickSort AppDir/usr/bin/

          # Copy OR-Tools libraries
          cp ${ORTOOLS_ROOT}/lib/libortools.so* AppDir/usr/lib/
          cp ${ORTOOLS_ROOT}/lib/libortools_flatzinc.so* AppDir/usr/lib/ || true

          # Create desktop file
          cat > AppDir/usr/share/applications/ClickSort.desktop << EOF
          [Desktop Entry]
          Type=Application
          Name=ClickSort
          Exec=ClickSort
          Icon=ClickSort
          Categories=Office;
          EOF

          # Create a simple icon (or copy yours if you have one)
          convert -size 256x256 xc:steelblue -fill white -gravity center -pointsize 48 -annotate 0 "CS" AppDir/usr/share/icons/hicolor/256x256/apps/ClickSort.png || \
            wget -q -O AppDir/usr/share/icons/hicolor/256x256/apps/ClickSort.png "https://via.placeholder.com/256/4682B4/FFFFFF?text=CS"

          # Build AppImage
          export QMAKE=$(find $QT_ROOT_DIR -name "qmake" -type f 2>/dev/null | head -1)
          echo "Using QMAKE: $QMAKE"
          export LD_LIBRARY_PATH="${ORTOOLS_ROOT}/lib:${QT_ROOT_DIR}/lib:$LD_LIBRARY_PATH"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage

          mkdir -p dist
          mv Click*.AppImage dist/ClickSort-x86_64.AppImage

      - name: Upload artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-linux
          path: dist/ClickSort-x86_64.AppImage

      - name: Create macOS App Bundle
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist

          # Create app bundle structure
          APP_DIR="dist/ClickSort.app"
          mkdir -p "${APP_DIR}/Contents/MacOS"
          mkdir -p "${APP_DIR}/Contents/Frameworks"
          mkdir -p "${APP_DIR}/Contents/Resources"

          cp build/src/ClickSort "${APP_DIR}/Contents/MacOS/"

          # Create Info.plist
          cat > "${APP_DIR}/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>ClickSort</string>
              <key>CFBundleIdentifier</key>
              <string>com.clicksort.app</string>
              <key>CFBundleName</key>
              <string>ClickSort</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          # Copy OR-Tools libraries
          cp ${ORTOOLS_ROOT}/lib/libortools*.dylib "${APP_DIR}/Contents/Frameworks/" || true

          # Find and use macdeployqt to bundle Qt frameworks
          MACDEPLOYQT=$(find $QT_ROOT_DIR -name "macdeployqt" -type f 2>/dev/null | head -1)
          if [ -z "$MACDEPLOYQT" ]; then
            MACDEPLOYQT=$(find $RUNNER_WORKSPACE -name "macdeployqt" -type f 2>/dev/null | head -1)
          fi
          echo "Using macdeployqt: $MACDEPLOYQT"
          $MACDEPLOYQT "${APP_DIR}" -verbose=2

          # Fix OR-Tools library paths
          for lib in "${APP_DIR}/Contents/Frameworks"/libortools*.dylib; do
            if [ -f "$lib" ]; then
              install_name_tool -add_rpath @executable_path/../Frameworks "${APP_DIR}/Contents/MacOS/ClickSort" 2>/dev/null || true
              # Update library ID
              install_name_tool -id "@rpath/$(basename $lib)" "$lib" 2>/dev/null || true
            fi
          done

          # Create DMG
          hdiutil create -volname "ClickSort" -srcfolder dist/ClickSort.app -ov -format UDZO dist/ClickSort.dmg

      - name: Upload artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-macos
          path: dist/ClickSort.dmg

      - name: Create Windows Distribution
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build/src/Release/ClickSort.exe dist/

          # Find windeployqt
          $windeployqt = Get-ChildItem -Path $env:QT_ROOT_DIR -Recurse -Filter "windeployqt.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $windeployqt) {
            $windeployqt = Get-ChildItem -Path $env:RUNNER_WORKSPACE -Recurse -Filter "windeployqt.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          Write-Host "Using windeployqt: $($windeployqt.FullName)"

          # Use windeployqt to bundle Qt DLLs
          & $windeployqt.FullName --release --no-translations dist/ClickSort.exe

          # Bundle OR-Tools DLLs
          Copy-Item "$env:ORTOOLS_ROOT/bin/*.dll" dist/ -ErrorAction SilentlyContinue

      - name: Create Inno Setup script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ([string]::IsNullOrEmpty($version)) {
            $version = "${{ github.event.inputs.tag }}".TrimStart('v')
          }
          if ([string]::IsNullOrEmpty($version)) {
            $version = "1.0.0"
          }

          $innoScript = @"
          [Setup]
          AppName=ClickSort
          AppVersion=$version
          AppPublisher=Your Name
          DefaultDirName={autopf}\ClickSort
          DefaultGroupName=ClickSort
          OutputDir=installer
          OutputBaseFilename=ClickSort-$version-setup
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64compatible
          WizardStyle=modern

          [Files]
          Source: "dist\*"; DestDir: "{app}"; Flags: recursesubdirs

          [Icons]
          Name: "{group}\ClickSort"; Filename: "{app}\ClickSort.exe"
          Name: "{group}\Uninstall ClickSort"; Filename: "{uninstallexe}"
          Name: "{autodesktop}\ClickSort"; Filename: "{app}\ClickSort.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"

          [Run]
          Filename: "{app}\ClickSort.exe"; Description: "Launch ClickSort"; Flags: nowait postinstall skipifsilent
          "@

          $innoScript | Out-File -FilePath "installer.iss" -Encoding UTF8
          New-Item -ItemType Directory -Force -Path installer

      - name: Build Windows Installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-windows
          path: installer/*.exe

  release:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'v')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Debug - show artifact structure
        run: |
          echo "=== Artifact directory structure ==="
          find artifacts -type f
          ls -laR artifacts/
          echo "==================================="

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          # Copy single-file artifacts directly
          cp artifacts/scheduler-linux/*.AppImage release-assets/ || true
          cp artifacts/scheduler-macos/*.dmg release-assets/ || true
          cp artifacts/scheduler-windows/*.exe release-assets/ || true

          echo "=== Release assets prepared ==="
          ls -la release-assets/

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.tag }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.tag }}
          body: |
            ## Installation

            **Linux:** Download the `.AppImage` file, make it executable (`chmod +x`), and run it.

            **macOS:** Download the `.dmg` file, open it, and drag the app to Applications.

            **Windows:** Download and run the `-setup.exe` installer.
          artifacts: "release-assets/*"
          allowUpdates: true
          removeArtifacts: true
