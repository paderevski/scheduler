name: Build

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            qt_host: linux
            qt_arch: gcc_64
            ortools_url: https://github.com/google/or-tools/releases/download/v9.11/or-tools_amd64_ubuntu-24.04_cpp_v9.11.4210.tar.gz
            ortools_dir: or-tools_x86_64_Ubuntu-24.04_cpp_v9.11.4210
          - os: macos-latest
            qt_host: mac
            qt_arch: clang_64
            ortools_url: https://github.com/google/or-tools/releases/download/v9.11/or-tools_arm64_macOS-14.6.1_cpp_v9.11.4210.tar.gz
            ortools_dir: or-tools_arm64_macOS-14.6.1_cpp_v9.11.4210
          - os: windows-latest
            qt_host: windows
            qt_arch: win64_msvc2019_64
            ortools_url: https://github.com/google/or-tools/releases/download/v9.11/or-tools_x64_VisualStudio2022_cpp_v9.11.4210.zip
            ortools_dir: or-tools_x64_VisualStudio2022_cpp_v9.11.4210

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.*"
          host: ${{ matrix.qt_host }}
          target: "desktop"
          arch: ${{ matrix.qt_arch }}
          modules: ""
          cache: true

      - name: Download OR-Tools (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          wget -q ${{ matrix.ortools_url }}
          tar -xzf or-tools_*.tar.gz
          echo "ORTOOLS_ROOT=${{ github.workspace }}/${{ matrix.ortools_dir }}" >> $GITHUB_ENV

      - name: Download OR-Tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "${{ matrix.ortools_url }}" -OutFile "or-tools.zip"
          Expand-Archive -Path "or-tools.zip" -DestinationPath "."
          echo "ORTOOLS_ROOT=${{ github.workspace }}\${{ matrix.ortools_dir }}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Python (for XLSX support)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure CMake (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${ORTOOLS_ROOT};${Qt6_DIR}"

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:ORTOOLS_ROOT;$env:Qt6_DIR"

      - name: Build
        run: cmake --build build --config Release -j

      - name: Prepare distribution (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp build/src/EngineeringWeekScheduler dist/
          cp README.md dist/
          # Bundle OR-Tools shared libraries
          cp ${ORTOOLS_ROOT}/lib/libortools.so.9 dist/
          cp ${ORTOOLS_ROOT}/lib/libortools_flatzinc.so.9 dist/ || true
          # Create launcher script that sets LD_LIBRARY_PATH
          cat > dist/run-scheduler.sh << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="${SCRIPT_DIR}:${LD_LIBRARY_PATH}"
          exec "${SCRIPT_DIR}/EngineeringWeekScheduler" "$@"
          EOF
          chmod +x dist/run-scheduler.sh
          chmod +x dist/EngineeringWeekScheduler

      - name: Upload artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-linux
          path: dist/

      - name: Prepare distribution (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp build/src/EngineeringWeekScheduler dist/
          cp README.md dist/
          # Bundle OR-Tools shared libraries
          cp ${ORTOOLS_ROOT}/lib/libortools.9.dylib dist/ || true
          cp ${ORTOOLS_ROOT}/lib/libortools_flatzinc.9.dylib dist/ || true
          # Fix library paths in binary
          install_name_tool -add_rpath @executable_path dist/EngineeringWeekScheduler || true
          # Create launcher script
          cat > dist/run-scheduler.sh << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export DYLD_LIBRARY_PATH="${SCRIPT_DIR}:${DYLD_LIBRARY_PATH}"
          exec "${SCRIPT_DIR}/EngineeringWeekScheduler" "$@"
          EOF
          chmod +x dist/run-scheduler.sh
          chmod +x dist/EngineeringWeekScheduler

      - name: Upload artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-macos
          path: dist/

      - name: Prepare distribution (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build/src/Release/EngineeringWeekScheduler.exe dist/
          Copy-Item README.md dist/
          # Bundle OR-Tools DLLs
          Copy-Item "$env:ORTOOLS_ROOT/bin/*.dll" dist/ -ErrorAction SilentlyContinue

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-windows
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Debug - show artifact structure
        run: |
          echo "=== Artifact directory structure ==="
          find artifacts -type f
          ls -laR artifacts/
          echo "==================================="

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          # Create zip archives for each platform (includes all bundled libraries)
          cd artifacts/scheduler-linux && zip -r ../../release-assets/EngineeringWeekScheduler-linux.zip . && cd ../..
          cd artifacts/scheduler-macos && zip -r ../../release-assets/EngineeringWeekScheduler-macos.zip . && cd ../..
          cd artifacts/scheduler-windows && zip -r ../../release-assets/EngineeringWeekScheduler-windows.zip . && cd ../..

          echo "=== Release assets prepared ==="
          ls -la release-assets/

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## Installation

            Download the zip file for your platform and extract it.

            **Linux/macOS:** Run `./run-scheduler.sh` (this sets up library paths automatically)

            **Windows:** Run `EngineeringWeekScheduler.exe` directly
          artifacts: "release-assets/*"
          allowUpdates: true
          removeArtifacts: true
